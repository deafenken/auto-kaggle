name: vision-timm
applies_to:
  - image-classification
  - image-segmentation             # requires custom head — see notes
  - audio-classification           # spectrogram input
min_vram_gb: 8
internet_required_at_train: true   # for downloading pretrained weights
internet_required_at_infer: false

base_hours_per_fold:
  image-classification: 2.0
  image-segmentation: 4.0
  audio-classification: 2.0

defaults:
  model_name: convnext_base.fb_in22k_ft_in1k
  pretrained: true
  image_size: 384
  epochs: 10
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-2
  optimizer: adamw
  scheduler: cosine
  mixed_precision: true
  num_workers: 4
  augmentation:
    policy: light
    horizontal_flip: 0.5
    rotation_degrees: 10
    color_jitter: 0.1
  tta:
    enabled: false
    n_views: 4
  feature_config:
    image_root: data/raw/images/
    target_col: label
    id_col: image_id

deps_python:
  - torch>=2.0
  - timm>=0.9
  - albumentations>=1.3
  - pandas
  - numpy
  - pyyaml
  - scikit-learn

entry_point: train.py
